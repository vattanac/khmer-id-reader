[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "khmer-id-reader"
version = "0.1.0"
description = "Free Cambodian national ID card OCR — reads all fields, verifies MRZ."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Sim Vattanac", email = "vattanacsim99@gmail.com" },
]
keywords = ["khmer", "ocr", "cambodia", "id-card", "mrz", "crnn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "Pillow>=9.0",
    "opencv-python-headless>=4.5",
    "numpy>=1.20",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
tesseract = ["pytesseract>=0.3"]
server = ["flask>=3.0"]

[project.scripts]
khmer-id-reader = "khmer_id_reader.cli:main"

[project.urls]
Homepage = "https://github.com/vattanac/khmer-id-reader"
Documentation = "https://github.com/vattanac/khmer-id-reader#readme"
Issues = "https://github.com/vattanac/khmer-id-reader/issues"
